[pytest]
# Not a .py file on purpose: the Cat imports every .py it finds in the plugin folder.
# The tests live in a hidden folder so that it does not import them either.
testpaths = .tests
# pytest skips directories that start with a dot unless told otherwise, so without this
# line `pytest .` (or `pytest <this folder>`) would collect no test at all. `.*` is left out
# of the list on purpose; the folders that hold no tests are named instead.
norecursedirs = .git .githooks .pytest-tmp DEV dist __pycache__ *.egg
pythonpath = . /app
addopts = -q -p no:cacheprovider
